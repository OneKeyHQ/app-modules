[package]
name = "electron-qr-scanner"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "=3.14.2", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "=3.6.12"

[build-dependencies]
napi-build = "=2.6.0"

[profile.release]
lto = true
strip = "symbols"
