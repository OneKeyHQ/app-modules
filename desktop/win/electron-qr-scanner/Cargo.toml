[package]
name = "electron-qr-scanner"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "=3.16.3", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "=3.7.2"
# QR reader: builds ZXing-C++ from bundled sources (needs CMake + MSVC).
zxing-cpp = { version = "=0.5.3", default-features = false, features = ["bundled"] }
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[build-dependencies]
napi-build = "=2.7.0"

[profile.release]
lto = true
strip = "symbols"
