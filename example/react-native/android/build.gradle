buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Build every Android library with the app's NDK, like Expo's root plugin
// does in app-monorepo. Without this AGP uses its default NDK for modules,
// and code built against a newer libc++ fails to load against React Native's
// libc++_shared.so (e.g. missing __cxa_init_primary_exception).
subprojects { project ->
  project.plugins.withId("com.android.library") {
    project.android.ndkVersion = rootProject.ext.ndkVersion
  }
}
