// Opt-in platform runner using the existing Android test library.
gradle.beforeProject { project ->
  if (project.path == ':onekeyfe_react-native-image') {
    project.plugins.withId('com.android.library') {
      project.android {
        useLibrary 'android.test.runner'
        useLibrary 'android.test.base'
        defaultConfig { testInstrumentationRunner 'android.test.InstrumentationTestRunner' }
        sourceSets {
          androidTest {
            java.srcDirs = ['../native-tests/android']
            manifest.srcFile '../native-tests/android/AndroidManifest.xml'
          }
        }
      }
    }
  }
}
