<svg xmlns="http://www.w3.org/2000/svg" width="900" height="386" viewBox="0 0 900 386" role="img" aria-labelledby="title desc">
<title id="title">system · bounded state variants</title>
<desc id="desc">Structural schematic. Blue is content; green is controls; dashed slots are optional. Not a device screenshot or a pixel specification.</desc>
<rect width="900" height="100%" rx="16" fill="#f5f7fa"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="24" y="36" font-size="22" fill="#172a3a" font-weight="600">system · bounded state variants</text>
<rect x="24" y="66" width="852" height="274" rx="8" fill="#fff" stroke="#bfcbd5"/>
<rect x="40" y="82" width="242" height="48" rx="8" fill="#eaf1fb" stroke="#91add0"/>
<text x="52" y="111.0" font-size="15" fill="#294766" font-weight="400">loading</text>
<rect x="298" y="82" width="558" height="48" rx="8" fill="#eaf1fb" stroke="#91add0"/>
<text x="310" y="111.0" font-size="15" fill="#294766" font-weight="400">skeleton / spinner + optional message</text>
<rect x="40" y="144" width="242" height="48" rx="8" fill="#eaf1fb" stroke="#91add0"/>
<text x="52" y="173.0" font-size="15" fill="#294766" font-weight="400">retry</text>
<rect x="298" y="144" width="362" height="48" rx="8" fill="#eaf1fb" stroke="#91add0"/>
<text x="310" y="173.0" font-size="15" fill="#294766" font-weight="400">message</text>
<rect x="676" y="144" width="180" height="48" rx="8" fill="#e9f5ee" stroke="#72a38a" stroke-dasharray="5 4"/>
<text x="688" y="173.0" font-size="15" fill="#2c6245" font-weight="400">actionText</text>
<rect x="40" y="206" width="242" height="48" rx="8" fill="#eaf1fb" stroke="#91add0"/>
<text x="52" y="235.0" font-size="15" fill="#294766" font-weight="400">warning</text>
<rect x="298" y="206" width="558" height="48" rx="8" fill="#eaf1fb" stroke="#91add0"/>
<text x="310" y="235.0" font-size="15" fill="#294766" font-weight="400">title + message</text>
<rect x="40" y="268" width="242" height="52" rx="8" fill="#eaf1fb" stroke="#91add0"/>
<text x="52" y="299.0" font-size="15" fill="#294766" font-weight="400">noMatch / end</text>
<rect x="298" y="268" width="260" height="52" rx="8" fill="#eaf1fb" stroke="#91add0"/>
<text x="310" y="299.0" font-size="15" fill="#294766" font-weight="400">message</text>
<rect x="574" y="268" width="282" height="52" rx="8" fill="#eaf1fb" stroke="#91add0"/>
<text x="586" y="299.0" font-size="15" fill="#294766" font-weight="400">spacer: height only</text>
<text x="24" y="366" font-size="13" fill="#64798b" font-weight="400">Variants are mutually exclusive. Refresh/pagination capability is owned by the list, not by a loading row.</text>
</g>
</svg>
