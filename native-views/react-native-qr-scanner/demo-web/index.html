<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OneKey Web QR Scanner · Multi-Code & Animated UR Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes scanLine {
      0% { transform: translateY(0%); opacity: 0; }
      10% { opacity: 0.9; }
      90% { opacity: 0.9; }
      100% { transform: translateY(340px); opacity: 0; }
    }
    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0.35); opacity: 0; }
      70% { transform: translate(-50%, -50%) scale(1.12); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    @keyframes pulseRing {
      0% { transform: scale(1); opacity: 0.55; }
      70% { transform: scale(1.55); opacity: 0; }
      100% { transform: scale(1.55); opacity: 0; }
    }
    .scan-line { animation: scanLine 2.1s linear infinite; }
    .qr-dot { animation: popIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .qr-dot-ring { animation: pulseRing 2s ease-out infinite; }
    .qr-dot:hover .qr-dot-core { transform: scale(1.14); }
    .qr-dot:active .qr-dot-core { transform: scale(0.94); }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-6 antialiased">
  <div class="max-w-5xl mx-auto space-y-5">
    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-zinc-800 pb-4">
      <div>
        <h1 class="text-lg font-semibold">OneKey 自研扫码 SDK · Web 闭环实测台</h1>
        <p class="text-xs text-zinc-400 mt-1">
          直接驱动 <code class="text-emerald-400">@onekeyfe/react-native-qr-scanner/web</code> 真实解码引擎（BarcodeDetector + 本地 zxing-wasm），无需摄像头即可全闭环验证 4 类场景
        </p>
      </div>
      <span id="statusBadge" class="px-2.5 py-1 rounded-full text-xs font-medium border bg-zinc-800 text-zinc-200 border-zinc-700">
        准备中…
      </span>
    </div>

    <!-- Test Case Switcher -->
    <div class="flex flex-wrap gap-2">
      <button data-case="a">a. 单码图片</button>
      <button data-case="b">b. 多码图片 (3 QR)</button>
      <button data-case="c">c. 动态码视频 (BC-UR)</button>
      <button data-case="d">d. 动态码 + 多码混合视频</button>
      <button data-case="camera">e. 真实摄像头</button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      <!-- Scanner Card (mirrors OneKey ScanQrCodeModal) -->
      <div class="lg:col-span-6 flex justify-center">
        <div class="w-[380px] rounded-3xl bg-[#111315] border border-zinc-800 shadow-2xl overflow-hidden">
          <div class="px-5 pt-5">
            <div id="viewport" class="relative w-full aspect-square rounded-2xl overflow-hidden bg-black border border-white/10 select-none">
              <video id="video" class="hidden absolute inset-0 w-full h-full object-cover" muted playsinline></video>
              <img id="stillImage" class="hidden absolute inset-0 w-full h-full object-contain bg-[#e9edf2]" alt="QR fixture" />

              <div id="scanLine" class="hidden pointer-events-none absolute inset-0 z-10">
                <div class="scan-line w-full h-0.5 bg-gradient-to-r from-transparent via-[#00B812] to-transparent shadow-[0_0_12px_#00B812]"></div>
              </div>

              <!-- UR Progress Pill -->
              <div id="urProgressWrap" class="hidden absolute bottom-3 left-3 right-3 z-20 p-2.5 rounded-xl bg-black/75 backdrop-blur-sm border border-white/10 space-y-1.5">
                <div class="flex items-center justify-between text-xs">
                  <span id="urProgressText" class="font-medium text-white">BC-UR 组装中 0%</span>
                </div>
                <div class="w-full h-1.5 rounded-full bg-white/15 overflow-hidden">
                  <div id="urProgressBar" class="h-full bg-[#00B812] transition-all duration-100" style="width: 0%"></div>
                </div>
              </div>

              <!-- Scheme A Multi-QR Selection Overlay -->
              <div id="selectionOverlay" class="hidden absolute inset-0 z-20">
                <div id="dimBackdrop" class="absolute inset-0 bg-black/50 cursor-pointer" title="点击空白处恢复扫码"></div>
                <div id="anchorsLayer" class="absolute inset-0 pointer-events-none"></div>
              </div>
            </div>
          </div>

          <div class="px-5 py-5 text-center space-y-2.5">
            <div id="footerTitle" class="text-sm font-medium text-white">准备中…</div>
            <div id="footerHint" class="text-xs text-zinc-400"></div>
            <button id="resumeBtn" class="hidden mt-1 px-5 py-2 rounded-full bg-white/12 hover:bg-white/20 text-white text-xs font-medium transition cursor-pointer">
              重新扫描 (Esc)
            </button>
          </div>
        </div>
      </div>

      <!-- Result & Live Event Log -->
      <div class="lg:col-span-6 space-y-4">
        <div class="p-4 rounded-2xl bg-zinc-900/80 border border-zinc-800 space-y-2">
          <div class="text-xs font-semibold uppercase tracking-wider text-zinc-400">解码结果</div>
          <pre id="resultBox" class="text-xs font-mono text-emerald-300 bg-black/50 p-3 rounded-xl overflow-x-auto min-h-[100px] whitespace-pre-wrap break-all">等待识别…</pre>
        </div>

        <div class="p-4 rounded-2xl bg-zinc-900/80 border border-zinc-800 space-y-2">
          <div class="text-xs font-semibold uppercase tracking-wider text-zinc-400">状态机 &amp; SDK 事件流</div>
          <div id="eventLog" class="text-[11px] font-mono text-zinc-300 bg-black/50 p-3 rounded-xl h-[220px] overflow-y-auto space-y-1"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/dist/main.js"></script>
</body>
</html>
