name: native-tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      jpush_live_cloud:
        description: Run the opt-in Jiguang sandbox register/login handshake
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-overlay-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - name: Validate native overlay package
        run: |
          corepack enable
          yarn install --immutable
          yarn workspace @onekeyfe/react-native-native-overlay typecheck
          yarn workspace @onekeyfe/react-native-native-overlay lint
          yarn workspace @onekeyfe/react-native-native-overlay test --runInBand
          yarn workspace @onekeyfe/react-native-native-overlay prepare
          yarn workspace @onekeyfe/react-native-native-overlay pack --out "$RUNNER_TEMP/native-overlay.tgz"
          mkdir "$RUNNER_TEMP/native-overlay"
          tar -xzf "$RUNNER_TEMP/native-overlay.tgz" -C "$RUNNER_TEMP/native-overlay"
          test -f "$RUNNER_TEMP/native-overlay/package/lib/module/index.js"
          test -f "$RUNNER_TEMP/native-overlay/package/lib/typescript/src/index.d.ts"
          test -f "$RUNNER_TEMP/native-overlay/package/common/cpp/react/renderer/components/RNCNativeOverlay/NativeOverlayShadowNode.cpp"
          test -f "$RUNNER_TEMP/native-overlay/package/android/src/main/jni/CMakeLists.txt"
          test -f "$RUNNER_TEMP/native-overlay/package/ios/RCTNativeOverlayComponentView.mm"

  device-utils-store:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Select and verify Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcodebuild -version | grep -F 'Xcode 26.6'
      - name: Restore Yarn download cache
        id: yarn-cache
        uses: actions/cache/restore@v4
        with:
          path: .yarn/cache
          key: yarn-v2-${{ runner.os }}-${{ runner.arch }}-yarn4.1.0-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json', '.yarn/patches/**') }}
          restore-keys: yarn-v2-${{ runner.os }}-${{ runner.arch }}-yarn4.1.0-
      - name: Install dependencies and generate DeviceUtils bindings
        run: |
          corepack enable
          yarn install --immutable
          yarn workspace @onekeyfe/react-native-device-utils nitrogen
      - name: Save Yarn download cache
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .yarn/cache
          key: ${{ steps.yarn-cache.outputs.cache-primary-key }}
      - name: Run production Swift store regressions
        working-directory: native-modules/react-native-device-utils
        env:
          TMPDIR: ${{ runner.temp }}
        run: node tests/in-memory-store.cjs --swift
      - name: Run Lite Card iOS manager input regressions
        working-directory: native-modules/react-native-lite-card
        shell: bash
        env:
          ONEKEY_LITE_IOS_LOG_TEST_OUTPUT: ${{ runner.temp }}/lite-card-ios-build-messages.txt
        run: |
          node tests/ios-input.cjs | tee "$RUNNER_TEMP/lite-card-input-tests.log"
          grep -Eq '^ManagerInput: [1-9][0-9]* assertions passed$' "$RUNNER_TEMP/lite-card-input-tests.log"
          node tests/source-id.cjs | tee "$RUNNER_TEMP/lite-card-source-id-tests.log"
          grep -Eq '^SourceIdentity: [1-9][0-9]* assertions passed$' "$RUNNER_TEMP/lite-card-source-id-tests.log"
          node tests/native-log-sanitization.cjs --swift "$RUNNER_TEMP/lite-card-ios-build-messages.txt" | tee "$RUNNER_TEMP/lite-card-sanitization-tests.log"
          grep -Eq '^SwiftLoggerSanitization: [1-9][0-9]* assertions passed$' "$RUNNER_TEMP/lite-card-sanitization-tests.log"
      - name: Run JPush & JCore iOS native E2E regressions
        working-directory: native-modules/react-native-jpush
        shell: bash
        run: |
          python3 scripts/test_ios_sdk.py | tee "$RUNNER_TEMP/jpush-ios-tests.log"
          grep -Fq 'ALL_IOS_SDK_TESTS_PASSED' "$RUNNER_TEMP/jpush-ios-tests.log"
      - name: Run four SwiftPM suites and verify execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/swiftpm
          packages=(
            native-modules/react-native-sni-connect
            native-modules/react-native-bundle-update
            native-modules/react-native-range-downloader/tests/swiftpm
            native-views/react-native-native-list/tests/swiftpm
          )
          for package in "${packages[@]}"; do
            name=$(basename "$package")
            if [[ "$package" == *range-downloader* ]]; then name=range-downloader; fi
            if [[ "$package" == *native-list* ]]; then name=native-list; fi
            swift test --package-path "$package" --scratch-path "$RUNNER_TEMP/swift-$name" \
              2>&1 | tee "artifacts/swiftpm/$name.log"
            if ! grep -Eq 'Executed [1-9][0-9]* tests?|Test run with [1-9][0-9]* tests?' "artifacts/swiftpm/$name.log"; then
              echo "No executed Swift tests for $package" >&2
              exit 1
            fi
          done
      - name: Upload SwiftPM logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swiftpm-native-test-logs
          path: artifacts/swiftpm/*.log
          if-no-files-found: warn

  android-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      JPUSH_LIVE_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.jpush_live_cloud && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore Yarn download cache
        id: yarn-cache
        uses: actions/cache/restore@v4
        with:
          path: .yarn/cache
          key: yarn-v2-${{ runner.os }}-${{ runner.arch }}-yarn4.1.0-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json', '.yarn/patches/**') }}
          restore-keys: yarn-v2-${{ runner.os }}-${{ runner.arch }}-yarn4.1.0-
      - name: Read pinned Kotlin compiler identity
        id: kotlin-pin
        run: node scripts/install-kotlin.mjs pin >> "$GITHUB_OUTPUT"
      - name: Restore Kotlin compiler archive
        id: kotlin-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kotlin-download/kotlin-compiler-${{ steps.kotlin-pin.outputs.version }}.zip
          key: kotlin-compiler-${{ steps.kotlin-pin.outputs.version }}-${{ steps.kotlin-pin.outputs.sha256 }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install and verify pinned Kotlin compiler
        run: |
          node scripts/install-kotlin.mjs "$RUNNER_TEMP/kotlin-download" "$RUNNER_TEMP/kotlin-compiler"
          echo "$RUNNER_TEMP/kotlin-compiler/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Save verified Kotlin compiler archive
        if: steps.kotlin-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kotlin-download/kotlin-compiler-${{ steps.kotlin-pin.outputs.version }}.zip
          key: ${{ steps.kotlin-cache.outputs.cache-primary-key }}
      - name: Install and generate native bindings
        run: |
          corepack enable
          yarn install --immutable
          # shellcheck disable=SC2016
          find native-modules native-views -mindepth 2 -maxdepth 2 -name nitro.json -print0 |
            xargs -0 -n1 -P4 bash -c 'yarn --cwd "$(dirname "$0")" nitrogen > /dev/null'
      - name: Save Yarn download cache
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .yarn/cache
          key: ${{ steps.yarn-cache.outputs.cache-primary-key }}
      - name: Run production Kotlin store regressions
        working-directory: native-modules/react-native-device-utils
        env:
          TMPDIR: ${{ runner.temp }}
        run: node tests/in-memory-store.cjs --kotlin
      - name: Run bundle-update Kotlin policy tests
        working-directory: native-modules/react-native-bundle-update
        run: |
          "$RUNNER_TEMP/kotlin-compiler/kotlinc/bin/kotlinc" \
            android/src/main/java/com/margelo/nitro/reactnativebundleupdate/BundleStorageSchemaPolicy.kt \
            tests/kotlin/BundleStorageSchemaPolicyTest.kt \
            -include-runtime -d "$RUNNER_TEMP/bundle-storage-schema-tests.jar"
          java -jar "$RUNNER_TEMP/bundle-storage-schema-tests.jar" | tee "$RUNNER_TEMP/kotlin-tests.log"
          grep -Eq 'BundleStorageSchemaPolicy: [1-9][0-9]* assertions passed' "$RUNNER_TEMP/kotlin-tests.log"
      - name: Run picker error privacy regression
        working-directory: native-modules/react-native-image-crop-picker
        shell: bash
        run: |
          "$RUNNER_TEMP/kotlin-compiler/kotlinc/bin/kotlinc" \
            android/src/main/java/com/margelo/nitro/reactnativeimagecroppicker/ImageCropPickerException.kt \
            tests/kotlin/ImageCropPickerExceptionTest.kt \
            -include-runtime -d "$RUNNER_TEMP/picker-error-privacy-tests.jar"
          java -jar "$RUNNER_TEMP/picker-error-privacy-tests.jar" | tee "$RUNNER_TEMP/picker-error-privacy-tests.log"
          grep -Eq '^ImageCropPickerException: [1-9][0-9]* assertions passed$' "$RUNNER_TEMP/picker-error-privacy-tests.log"
      - name: Run Lite Card Android session ownership regressions
        working-directory: native-modules/react-native-lite-card
        shell: bash
        run: |
          node tests/android-session.cjs | tee "$RUNNER_TEMP/lite-card-session-tests.log"
          grep -Eq '^CardSession: [1-9][0-9]* assertions passed$' "$RUNNER_TEMP/lite-card-session-tests.log"
      - name: Run Lite Card SDK C++ and JNI native regressions
        working-directory: native-modules/react-native-lite-card/sdk
        shell: bash
        env:
          ONEKEY_LITE_JNI_LOG_TEST_OUTPUT: ${{ runner.temp }}/lite-card-jni-build-messages.txt
        run: |
          cmake -S . -B "$RUNNER_TEMP/lite-card-sdk-build" -DBUILD_TESTING=ON -DGPCHANNEL_HOST_JNI=ON
          cmake --build "$RUNNER_TEMP/lite-card-sdk-build" --parallel
          ctest --test-dir "$RUNNER_TEMP/lite-card-sdk-build" --output-on-failure -V | tee "$RUNNER_TEMP/lite-card-sdk-tests.log"
          grep -Fq 'Native security regression tests + 5000 malformed-input cases passed' "$RUNNER_TEMP/lite-card-sdk-tests.log"
      - name: Run production Kotlin logger sanitization regression
        working-directory: native-modules/react-native-lite-card
        shell: bash
        run: |
          test -s "$RUNNER_TEMP/lite-card-jni-build-messages.txt"
          node tests/native-log-sanitization.cjs --kotlin "$RUNNER_TEMP/lite-card-jni-build-messages.txt" | tee "$RUNNER_TEMP/lite-card-sanitization-tests.log"
          grep -Eq '^KotlinLoggerSanitization: [1-9][0-9]* assertions passed$' "$RUNNER_TEMP/lite-card-sanitization-tests.log"
      - name: Run twelve Android unit test suites and build capture protection and photo saving
        working-directory: example/react-native/android
        run: |
          cat > "$RUNNER_TEMP/rerun-native-tests.gradle" <<'GRADLE'
          allprojects {
            tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
              outputs.upToDateWhen { false }
              outputs.cacheIf { false }
            }
          }
          GRADLE
          ./gradlew --continue --no-daemon --parallel --max-workers=4 --console=plain \
            --build-cache --init-script "$RUNNER_TEMP/rerun-native-tests.gradle" \
            :onekeyfe_react-native-app-update:testDebugUnitTest \
            :onekeyfe_react-native-bundle-crypto:testDebugUnitTest \
            :onekeyfe_react-native-jpush:testDebugUnitTest \
            :onekey-jpush-fcm:testDebugUnitTest \
            :onekeyfe_react-native-network-throttle:testDebugUnitTest \
            :onekeyfe_react-native-range-downloader:testDebugUnitTest \
            :onekeyfe_react-native-sni-connect:testDebugUnitTest \
            :onekeyfe_react-native-auto-size-input:testDebugUnitTest \
            :onekeyfe_react-native-image:testDebugUnitTest \
            :onekeyfe_react-native-native-list:testDebugUnitTest \
            :onekeyfe_react-native-native-overlay:testDebugUnitTest \
            :onekeyfe_react-native-text-input:testDebugUnitTest \
            :onekeyfe_react-native-capture-protection:assembleDebug \
            :onekeyfe_react-native-photo-library:assembleDebug
      - name: Run JPush Java host regressions with real JUnit
        working-directory: native-modules/react-native-jpush
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_android_sdk.py | tee "$RUNNER_TEMP/jpush-android-host-tests.log"
          grep -Fq 'ALL_ANDROID_SDK_TESTS_PASSED' "$RUNNER_TEMP/jpush-android-host-tests.log"
      - name: Verify every Android suite executed tests
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          packages = {
              'native-modules/react-native-app-update',
              'native-modules/react-native-bundle-crypto',
              'native-modules/react-native-jpush',
              'native-modules/react-native-jpush/android/fcm',
              'native-modules/react-native-network-throttle',
              'native-modules/react-native-range-downloader',
              'native-modules/react-native-sni-connect',
              'native-views/react-native-auto-size-input',
              'native-views/react-native-image',
              'native-views/react-native-native-list',
              'native-views/react-native-native-overlay',
              'native-views/react-native-text-input',
          }
          total = 0
          for package in sorted(packages):
              build_dir = Path(package) / ('build' if package.endswith('/android/fcm') else 'android/build')
              reports = list((build_dir / 'test-results/testDebugUnitTest').glob('TEST-*.xml'))
              suites = [ET.parse(report).getroot() for report in reports]
              skipped = sum(int(suite.attrib.get('skipped', 0)) for suite in suites)
              count = sum(int(suite.attrib['tests']) for suite in suites) - skipped
              print(f'{package}: {count} executed, {skipped} skipped in {len(reports)} reports')
              if count <= 0:
                  raise SystemExit(f'No executed tests for {package}')
              total += count
          print(f'Android unit tests executed: {total}')
          PY
      - name: Upload Android test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-test-reports
          path: |
            native-modules/*/android/build/test-results/testDebugUnitTest/*.xml
            native-modules/react-native-jpush/android/fcm/build/test-results/testDebugUnitTest/*.xml
            ${{ runner.temp }}/jpush-android-host-tests.log
            native-views/*/android/build/test-results/testDebugUnitTest/*.xml
            example/react-native/android/build/reports/problems/
          if-no-files-found: warn

  ios-native:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: example/react-native
          ruby-version: '3.4.4'
          bundler-cache: true
      - name: Restore Yarn download cache
        id: yarn-cache
        uses: actions/cache/restore@v4
        with:
          path: .yarn/cache
          key: yarn-v2-${{ runner.os }}-${{ runner.arch }}-yarn4.1.0-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json', '.yarn/patches/**') }}
          restore-keys: yarn-v2-${{ runner.os }}-${{ runner.arch }}-yarn4.1.0-
      - name: Restore CocoaPods and React Native download caches
        id: pod-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods/Pods
            ~/Library/Caches/ReactNative/*.tar.gz
          key: ios-pods-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', 'example/react-native/Gemfile.lock', 'example/react-native/ios/Podfile.lock') }}
          restore-keys: |
            ios-pods-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Select and verify Xcode and test simulator
        id: xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | grep -F 'Xcode 26.6'
          echo "version-hash=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -F 'iOS 26.5'
          sim_line=$(xcrun simctl list devices available | grep -F 'iPhone 17 Pro (' | head -n 1)
          echo "$sim_line"
          sim_udid=$(echo "$sim_line" | grep -Eo '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          test -n "$sim_udid"
          echo "SIMULATOR_UDID=$sim_udid" >> "$GITHUB_ENV"
          df -h .
      - name: Install and generate native bindings
        id: install-bindings
        timeout-minutes: 8
        run: |
          corepack enable
          yarn install --immutable
          # shellcheck disable=SC2016
          find native-modules native-views -mindepth 2 -maxdepth 2 -name nitro.json -print0 |
            xargs -0 -n1 -P4 bash -c 'yarn --cwd "$(dirname "$0")" nitrogen > /dev/null'
      - name: Save Yarn download cache
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .yarn/cache
          key: ${{ steps.yarn-cache.outputs.cache-primary-key }}
      - name: Restore installed CocoaPods
        id: installed-pods-cache
        uses: actions/cache/restore@v4
        with:
          path: example/react-native/ios/Pods
          key: ios-installed-pods-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version-hash }}-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json', '.yarn/patches/**', 'example/react-native/package.json', 'example/react-native/Gemfile.lock', 'example/react-native/ios/Podfile', 'example/react-native/ios/Podfile.lock', 'native-modules/**/package.json', 'native-views/**/package.json', 'native-modules/**/*.podspec', 'native-views/**/*.podspec', 'native-modules/**/nitro.json', 'native-views/**/nitro.json', 'native-modules/**/*.nitro.ts', 'native-views/**/*.nitro.ts') }}
      - name: Install CocoaPods test specs and verify lockfile
        timeout-minutes: 10
        working-directory: example/react-native/ios
        env:
          CURL_HOME: ${{ runner.temp }}/ios-pod-curl
        run: |
          mkdir -p "$CURL_HOME"
          cat > "$CURL_HOME/.curlrc" <<'CURLRC'
          connect-timeout = 30
          speed-limit = 16384
          speed-time = 60
          max-time = 240
          retry = 2
          retry-max-time = 300
          retry-delay = 2
          CURLRC
          bundle exec pod install
          ruby - <<'RUBY'
          require 'yaml'

          def normalized_lockfile(text)
            lockfile = YAML.safe_load(text, permitted_classes: [Symbol], aliases: true)
            checksums = lockfile.fetch('SPEC CHECKSUMS')
            checksum = checksums.fetch('hermes-engine')
            abort 'Invalid Hermes podspec checksum' unless checksum.match?(/\A[0-9a-f]{40}\z/)
            checksums['hermes-engine'] = '<host-path-dependent>'

            # CocoaPods may retain the previous Specs Git URL in the lockfile
            # even when the Podfile now resolves the same specs through trunk CDN.
            repos = lockfile.fetch('SPEC REPOS')
            git_specs = repos.delete('https://github.com/CocoaPods/Specs.git')
            if git_specs
              repos['trunk'] = ((repos['trunk'] || []) + git_specs).sort
            end
            lockfile
          end

          committed = IO.popen(
            ['git', 'show', 'HEAD:example/react-native/ios/Podfile.lock'], &:read
          )
          installed = File.read('Podfile.lock')
          unless normalized_lockfile(committed) == normalized_lockfile(installed)
            abort 'CocoaPods changed the locked dependencies or checksums'
          end
          puts 'Podfile.lock matches: only the Hermes checksum and Specs CDN URL may differ'
          RUBY
      - name: Save installed CocoaPods before modifying the Pods project
        if: steps.installed-pods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: example/react-native/ios/Pods
          key: ${{ steps.installed-pods-cache.outputs.cache-primary-key }}
      - name: Keep only complete React Native downloads
        id: validate-rn-cache
        if: always() && steps.install-bindings.outcome == 'success'
        shell: bash
        run: |
          cache="$HOME/Library/Caches/ReactNative"
          if [[ -d "$cache" ]]; then
            while IFS= read -r -d '' file; do
              tar -tzf "$file" > /dev/null || rm -f "$file"
            done < <(find "$cache" -type f -name '*.tar.gz' -print0)
          fi
      - name: Save CocoaPods and React Native download caches
        if: always() && steps.validate-rn-cache.outcome == 'success' && steps.pod-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods/Pods
            ~/Library/Caches/ReactNative/*.tar.gz
          key: ${{ steps.pod-cache.outputs.cache-primary-key }}
      - name: Build Lite Card and NativeOverlay pods and run all XCTest suites
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios
          workspace=example/react-native/ios/example.xcworkspace
          node scripts/ios-native-plan.mjs > "$RUNNER_TEMP/ios-native-plan.json"
          BUNDLE_GEMFILE="$PWD/example/react-native/Gemfile" bundle exec ruby - "$RUNNER_TEMP/ios-native-plan.json" <<'RUBY'
          require 'json'
          require 'xcodeproj'

          plan = JSON.parse(File.read(ARGV.fetch(0)))
          project_path = 'example/react-native/ios/Pods/Pods.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          scheme = Xcodeproj::XCScheme.new
          plan.fetch('buildTargets').each do |name|
            target = project.targets.find { |candidate| candidate.name == name }
            abort "Missing pod target: #{name}" unless target
            if name == 'ReactNativeLiteCard'
              identity_phase = target.shell_script_build_phases.find { |phase| phase.name == '[CP-User] Generate Lite native source identity' }
              abort 'Lite source identity phase must hide environment variables' unless identity_phase&.show_env_vars_in_log == '0'
            end
            scheme.add_build_target(target, true)
          end
          plan.fetch('testSchemes').each do |name|
            target = project.targets.find { |candidate| candidate.name == name }
            abort "Missing unit test target: #{name}" unless target && target.product_type == 'com.apple.product-type.bundle.unit-test'
            target.dependencies.reject! do |dep|
              dep.name&.start_with?('AppHost-') || dep.target&.name&.start_with?('AppHost-')
            end
            target.build_configurations.each do |config|
              config.build_settings.delete('TEST_HOST')
              config.build_settings.delete('BUNDLE_LOADER')
              config.build_settings['LD_RUNPATH_SEARCH_PATHS'] = [
                '$(inherited)',
                '@executable_path/Frameworks',
                '@loader_path/Frameworks',
                '$(PODS_XCFRAMEWORKS_BUILD_DIR)/hermes-engine/Pre-built',
                '$(PODS_ROOT)/hermes-engine/destroot/Library/Frameworks/universal/hermesvm.xcframework/ios-arm64_x86_64-simulator'
              ]
            end
            scheme.add_build_target(target, false)
            scheme.add_test_target(target)
          end
          project.save
          scheme.save_as(project_path, 'AppModulesNativeTests', true)
          RUBY
          xcodebuild -list -workspace "$workspace" > artifacts/ios/schemes.log
          grep -Fxq '        AppModulesNativeTests' artifacts/ios/schemes.log
          jobs=$(sysctl -n hw.ncpu 2>/dev/null || echo 4)
          # shellcheck disable=SC2016
          xcode_args=(
            -workspace "$workspace" -scheme AppModulesNativeTests
            -derivedDataPath "$RUNNER_TEMP/native-tests-derived-data"
            -resultBundlePath "$PWD/artifacts/ios/AppModulesNativeTests.xcresult"
            -jobs "$jobs" CODE_SIGNING_ALLOWED=NO
            COMPILER_INDEX_STORE_ENABLE=NO ONLY_ACTIVE_ARCH=YES ARCHS=arm64
            DEBUG_INFORMATION_FORMAT=dwarf IPHONEOS_DEPLOYMENT_TARGET=16.4
            'OTHER_LDFLAGS=$(inherited) -lc++'
          )
          xcodebuild test "${xcode_args[@]}" -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -parallel-testing-enabled NO 2>&1 | tee artifacts/ios/AppModulesNativeTests.log
          archive="$RUNNER_TEMP/native-tests-derived-data/Build/Products/Debug-iphonesimulator/ReactNativeLiteCard/libReactNativeLiteCard.a"
          test -s "$archive"
          nm -g "$archive" > artifacts/ios/LiteCard.symbols.txt
          grep -Eq '[[:space:]][DRS][[:space:]]_GPChannelSDKCoreVersionString$' artifacts/ios/LiteCard.symbols.txt
          xcrun xcresulttool get test-results summary \
            --path artifacts/ios/AppModulesNativeTests.xcresult \
            > artifacts/ios/summary.json
          jq -e '.totalTestCount > 0' artifacts/ios/summary.json
          xcrun xcresulttool get test-results tests \
            --path artifacts/ios/AppModulesNativeTests.xcresult \
            > artifacts/ios/tests.json
          python3 - "$RUNNER_TEMP/ios-native-plan.json" <<'PYTEST'
          import json
          import sys
          from pathlib import Path

          def walk(nodes):
              for node in nodes:
                  yield node
                  yield from walk(node.get('children', []))

          report = json.loads(Path('artifacts/ios/tests.json').read_text())
          plan = json.loads(Path(sys.argv[1]).read_text())
          counts = {name: 0 for name in plan['testSchemes']}
          for node in walk(report['testNodes']):
              if node['nodeType'] != 'Unit test bundle':
                  continue
              name = node['name'].removesuffix('.xctest')
              if name in counts:
                  counts[name] += sum(
                      test['nodeType'] == 'Test Case' and test.get('result') in {'Passed', 'Failed', 'Expected Failure'}
                      for test in walk(node.get('children', []))
                  )
          for name, count in counts.items():
              print(f'{name}: {count} executed tests')
              if count == 0:
                  raise SystemExit(f'No executed tests for {name}')
          PYTEST
          df -h .
      - name: Upload iOS result bundles and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-results
          path: artifacts/ios/
          if-no-files-found: warn

  ios-xctest:
    if: ${{ always() }}
    needs: [ios-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Require iOS native tests to succeed
        id: gate
        env:
          IOS_NATIVE_RESULT: ${{ needs.ios-native.result }}
        run: node scripts/check-ios-native-results.mjs
