name: Zcash runtime

on:
  pull_request:
    paths:
      - 'chain-runtimes/zcash/**'
      - '.github/workflows/zcash-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'chain-runtimes/zcash/**'
      - '.github/workflows/zcash-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: chain-runtimes/zcash
    steps:
      - uses: actions/checkout@v6
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm binaryen libsqlite3-dev pkg-config
          rustup toolchain install 1.93.0 --profile minimal --target wasm32-unknown-unknown
          cargo install wasm-pack --version 0.15.0 --locked
          WASM_BINDGEN_VERSION=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - name: Restore pinned vendor sources
        run: bash scripts/vendor-deps.sh
      - name: Test vendor reconstruction guards
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Build runtime and keys together
        env:
          CC_wasm32_unknown_unknown: /usr/bin/clang
          AR_wasm32_unknown_unknown: /usr/bin/llvm-ar
        run: bash scripts/build-wasm.sh --offline
      - uses: actions/upload-artifact@v4
        with:
          name: zcash-wasm-${{ github.sha }}
          if-no-files-found: error
          path: |
            chain-runtimes/zcash/pkg/
            chain-runtimes/zcash/pkg-keys/
