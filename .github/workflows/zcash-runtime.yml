name: Zcash runtime

# Builds and tests on runtime changes. A manual run also publishes the branch's
# alpha version; a push to main publishes a new rc or latest version.
on:
  pull_request:
    paths:
      - 'chain-runtimes/zcash/**'
  push:
    branches: [main]
    paths:
      - 'chain-runtimes/zcash/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: chain-runtimes/zcash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
      # Manual runs publish the branch's alpha version to npm next; rc and
      # latest versions publish only when merged to main.
      - name: Select release channel
        id: channel
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          case "$VERSION" in
            *-alpha.*) TAG=next ;;
            *-rc.*) TAG=rc ;;
            *) TAG=latest ;;
          esac
          PUBLISH=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$TAG" = next || { echo "Manual runs publish alpha versions only; merge $VERSION to main instead" >&2; exit 1; }
            PUBLISH=true
          elif [ "$EVENT_NAME" = push ] && [ "$TAG" != next ]; then
            PUBLISH=true
          fi
          if [ "$PUBLISH" = true ] && npm view "onekey-zcash-runtime@$VERSION" version >/dev/null 2>&1; then
            test "$EVENT_NAME" = push || { echo "onekey-zcash-runtime@$VERSION is already on npm" >&2; exit 1; }
            PUBLISH=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, npm dist-tag $TAG, publish: $PUBLISH" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Binaryen 133 (same wasm-opt as local builds)
        run: |
          BINARYEN=version_133
          case "$(uname -m)" in
            x86_64) ARCH=x86_64 SHA=2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489 ;;
            aarch64) ARCH=aarch64 SHA=89c07ea56faf38d0fbecf36ca8ec0721756716185f265b568e133d427f299bf8 ;;
            *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
          esac
          curl -sSfL -o /tmp/binaryen.tgz "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN}/binaryen-${BINARYEN}-${ARCH}-linux.tar.gz"
          echo "${SHA}  /tmp/binaryen.tgz" | sha256sum -c -
          sudo tar xzf /tmp/binaryen.tgz -C /opt
          echo "/opt/binaryen-${BINARYEN}/bin" >> "$GITHUB_PATH"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libsqlite3-dev pkg-config
          rustup toolchain install 1.93.0 --profile minimal --target wasm32-unknown-unknown
          cargo install wasm-pack --version 0.15.0 --locked
          WASM_BINDGEN_VERSION=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - name: Restore pinned vendor sources
        run: bash scripts/vendor-deps.sh
      - name: Test vendor reconstruction guards
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Build runtime and keys together
        env:
          CC_wasm32_unknown_unknown: /usr/bin/clang
          AR_wasm32_unknown_unknown: /usr/bin/llvm-ar
        run: bash scripts/build-wasm.sh --offline
      - name: Verify complete artifact provenance
        run: python3 scripts/artifact-manifest.py verify --expected-revision "${{ github.sha }}"
      - name: Pack and verify npm archives
        env:
          VERSION: ${{ steps.channel.outputs.version }}
          TAG: ${{ steps.channel.outputs.tag }}
        run: python3 scripts/package-release.py pack --version "$VERSION" --tag "$TAG" --revision "$GITHUB_SHA"
      # Kept so a half-finished publish can be completed from the same bytes.
      - uses: actions/upload-artifact@v4
        with:
          name: zcash-npm-${{ github.sha }}
          if-no-files-found: error
          path: chain-runtimes/zcash/dist/
      - name: Publish runtime and keys
        if: steps.channel.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.channel.outputs.version }}
          TAG: ${{ steps.channel.outputs.tag }}
        run: |
          npm publish "dist/onekey-zcash-runtime-${VERSION}.tgz" --ignore-scripts --access public --tag "$TAG"
          npm publish "dist/onekey-zcash-keys-${VERSION}.tgz" --ignore-scripts --access public --tag "$TAG"
