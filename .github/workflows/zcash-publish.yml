name: Publish Zcash runtime

# Manual runs publish alpha builds only, from any branch. rc and latest are
# published only when a version change in chain-runtimes/zcash/Cargo.toml is
# merged to main.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact workspace alpha version (for example 0.1.0-alpha.1)
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'chain-runtimes/zcash/Cargo.toml'

permissions:
  contents: read

concurrency:
  group: zcash-npm-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Decide what to publish
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("chain-runtimes/zcash/Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          case "$VERSION" in
            *-alpha.*) TAG=alpha ;;
            *-rc.*) TAG=rc ;;
            *) TAG=latest ;;
          esac
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$INPUT_VERSION" = "$VERSION" || { echo "Input $INPUT_VERSION does not match workspace $VERSION" >&2; exit 1; }
            test "$TAG" = alpha || { echo "Manual runs publish alpha only; merge $VERSION to main instead" >&2; exit 1; }
          elif [ "$TAG" = alpha ]; then
            echo "Alpha versions are published manually; nothing to do on main" >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 - "$VERSION" "$TAG" <<'PY'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('release', 'chain-runtimes/zcash/scripts/package-release.py')
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          release.check_version(sys.argv[1], sys.argv[1], sys.argv[2])
          PY
          if npm view "onekey-zcash-runtime@$VERSION" version >/dev/null 2>&1; then
            echo "onekey-zcash-runtime@$VERSION is already on npm" >> "$GITHUB_STEP_SUMMARY"
            test "$EVENT_NAME" = push || exit 1
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"
  build:
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    uses: ./.github/workflows/zcash-runtime.yml
  publish:
    needs: [validate, build]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: npm-zcash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: zcash-wasm-${{ github.sha }}
          path: chain-runtimes/zcash
      - name: Recheck and pack the verified build
        working-directory: chain-runtimes/zcash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: python3 scripts/package-release.py pack --version "$RELEASE_VERSION" --tag "$RELEASE_TAG" --revision "$GITHUB_SHA"
      - name: Publish the runtime and keys pair
        working-directory: chain-runtimes/zcash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          npm publish "dist/onekey-zcash-runtime-${RELEASE_VERSION}.tgz" --ignore-scripts --access public --tag "$RELEASE_TAG"
          npm publish "dist/onekey-zcash-keys-${RELEASE_VERSION}.tgz" --ignore-scripts --access public --tag "$RELEASE_TAG"
