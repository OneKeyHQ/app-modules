name: package-publish

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      npm_dist_tag:
        description: "next/pr-145 on development branches; latest on main"
        required: true
        default: next
        type: choice
        options:
          - next
          - latest
          - pr-145
      only_workspace:
        description: "Publish only this workspace, e.g. @onekeyfe/react-native-bundle-crypto. Leave empty to publish every package."
        required: false
        default: ""
        type: string
      recovery_version:
        description: "Exact version from the failed release summary; required with only_workspace."
        required: false
        default: ""
        type: string
      recovery_commit:
        description: "Full source commit from the failed release summary; required with only_workspace."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: app-modules-package-publish
  # Supported on GitHub.com; keep pending publish runs instead of replacing them.
  # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency
  queue: max

jobs:
  notice-fork-merge:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Explain manual release requirement
        run: |
          echo 'A merged fork PR does not trigger an automatic package release. Run package-publish manually when ready.' >> "$GITHUB_STEP_SUMMARY"

  package-publish:
    permissions:
      contents: read
      id-token: write
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      ONLY_WORKSPACE: ${{ inputs.only_workspace || '' }}
    steps:
      - name: Validate recovery inputs
        env:
          RECOVERY_VERSION: ${{ inputs.recovery_version || '' }}
          RECOVERY_COMMIT: ${{ inputs.recovery_commit || '' }}
        run: |
          if test -n "$ONLY_WORKSPACE"; then
            test -n "$RECOVERY_VERSION" || { echo 'Single-workspace recovery requires recovery_version'; exit 1; }
            [[ "$RECOVERY_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Single-workspace recovery requires the full recovery_commit'; exit 1; }
          elif test -n "$RECOVERY_VERSION" || test -n "$RECOVERY_COMMIT"; then
            echo 'Recovery inputs require only_workspace'
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.recovery_commit || (github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha) }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify recovery source belongs to the selected branch
        if: inputs.only_workspace != ''
        env:
          RELEASE_BRANCH_SHA: ${{ github.sha }}
        run: git merge-base --is-ancestor HEAD "$RELEASE_BRANCH_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: "https://registry.npmjs.org"
      - name: Select release channel
        id: channel
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_DIST_TAG: ${{ inputs.npm_dist_tag || '' }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          dist_tag=$(node scripts/detect-release-channel.mjs)
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "Selected npm dist-tag: $dist_tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Install and test release tooling
        run: |
          corepack enable
          yarn install --immutable
          node --test scripts/*.test.mjs
      - name: Prepare synchronized publish version
        env:
          PREVIEW_NUMBER: ${{ github.run_number }}
          RECOVERY_VERSION: ${{ inputs.recovery_version || '' }}
          RECOVERY_COMMIT: ${{ inputs.recovery_commit || '' }}
          NPM_DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
        run: |
          publish_version=$(node scripts/prepare-preview.mjs "$PREVIEW_NUMBER" "$NPM_DIST_TAG" "$RECOVERY_VERSION" "$RECOVERY_COMMIT")
          YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install
          node scripts/validate-npm-dist-tag.mjs "${{ steps.channel.outputs.dist_tag }}"
          git diff --check
          echo "Publishing $publish_version with the ${{ steps.channel.outputs.dist_tag }} tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve published version
        id: release
        run: |
          version=$(node -p "require('./native-views/react-native-native-list/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Published version: $version" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate release version and dist-tag
        env:
          NPM_DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
        run: node scripts/validate-npm-dist-tag.mjs "$NPM_DIST_TAG"
      - name: Publish missing packages after merge
        if: github.event_name == 'pull_request'
        env:
          NPM_CONFIG_PROVENANCE: "true"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
        run: node scripts/publish-missing.mjs "$NPM_DIST_TAG"
      - name: Publish missing packages manually
        if: github.event_name == 'workflow_dispatch' && inputs.only_workspace == ''
        env:
          NPM_CONFIG_PROVENANCE: "true"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
        run: node scripts/publish-missing.mjs "$NPM_DIST_TAG"
      - name: Publish a single workspace manually
        if: github.event_name == 'workflow_dispatch' && inputs.only_workspace != ''
        env:
          NPM_CONFIG_PROVENANCE: "true"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
        run: node scripts/publish-missing.mjs "$NPM_DIST_TAG" "$ONLY_WORKSPACE"
      - name: Verify the published versions are on the registry
        env:
          NPM_DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
        run: node scripts/verify-published.mjs "$NPM_DIST_TAG" "$ONLY_WORKSPACE"
