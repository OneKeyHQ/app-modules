name: cli-checks

on:
  pull_request:
    paths:
      - 'cli/**'
      - '.github/workflows/cli-checks.yml'
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - '.github/workflows/cli-checks.yml'

permissions:
  contents: read

concurrency:
  group: cli-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onekey-release-sign:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cli/onekey-release-sign
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
      - name: Verify GnuPG is available
        run: gpg --version
      - name: Run CLI unit and end-to-end GPG multisig tests
        run: npm run check
