name: publish-runtime-packages

# Manual only. Builds each runtime with chain-runtimes/<runtime>/scripts/ci.sh
# and publishes exactly the packages listed in the publish step.
on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    strategy:
      matrix:
        runtime: [zcash, monero]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: chain-runtimes/${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
      - name: Install build tools
        run: |
          curl -sSfL -o /tmp/binaryen.tgz https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  /tmp/binaryen.tgz" | sha256sum -c -
          sudo tar xzf /tmp/binaryen.tgz -C /opt
          echo /opt/binaryen-version_133/bin >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y clang llvm libsqlite3-dev libssl-dev pkg-config
          rustup toolchain install
          cargo install wasm-pack --version 0.15.0 --locked
          # Must match wasm-bindgen in both runtimes' Cargo.lock.
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Test, build and pack
        env:
          CC_wasm32_unknown_unknown: /usr/bin/clang
          AR_wasm32_unknown_unknown: /usr/bin/llvm-ar
        run: bash scripts/ci.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.runtime }}
          path: chain-runtimes/${{ matrix.runtime }}/dist/
          if-no-files-found: error

  # Separate job so the npm token never shares a runner with build code,
  # which can rewrite PATH and env for later steps of the same job.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: runtime-npm-publish
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
      # Each artifact lands in dist/<runtime>/.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
      - name: Publish versions missing from npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # The only packages this workflow publishes, as <runtime>/<package>;
          # each is published as @onekeyfe/<package>.
          packages='zcash/zcash-keys zcash/zcash-runtime monero/monero-runtime'
          # main publishes x.y.z or x.y.z-<pre>.n; other branches only x.y.z-alpha.n.
          versions='^[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$'
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            versions='^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$'
          fi
          field() { tar -xOzf "dist/$1.tgz" package/package.json | jq -r ".$2"; }

          # Check every package before publishing any.
          for pkg in $packages; do
            if [ "$(field "$pkg" name)" != "@onekeyfe/$(basename "$pkg")" ]; then
              echo "::error::dist/$pkg.tgz is missing or is not @onekeyfe/$(basename "$pkg")"
              exit 1
            fi
            if [[ ! "$(field "$pkg" version)" =~ $versions ]]; then
              echo "::error::$pkg: version not allowed on $GITHUB_REF"
              exit 1
            fi
          done

          for pkg in $packages; do
            name="@onekeyfe/$(basename "$pkg")"
            version=$(field "$pkg" version)
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version already published"
              continue
            fi
            tag=latest
            if [[ "$version" =~ - ]]; then tag=next; fi
            npm publish "dist/$pkg.tgz" --tag "$tag"
          done
