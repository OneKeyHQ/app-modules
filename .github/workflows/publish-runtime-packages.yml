name: publish-runtime-packages

# Builds and tests every chain runtime that provides the CI hook
# chain-runtimes/<runtime>/scripts/ci.sh, which tests, builds and packs its
# npm tarballs into dist/. A manual run also publishes each package whose
# version is not on npm yet; a runtime may only publish onekey-<runtime>-*, and
# branches other than main publish alpha versions only.
# Pull requests never reach the publish job or its credentials. npm prefers
# trusted publishing (OIDC) once a package has it configured and falls back to
# NPM_TOKEN otherwise; reviewers on the runtime-npm-publish environment, when
# configured, gate every publish.
on:
  pull_request:
    paths:
      - 'chain-runtimes/**'
  workflow_dispatch:

permissions: {}

jobs:
  runtimes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      list: ${{ steps.find.outputs.list }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: find
        run: |
          list=$(find chain-runtimes -mindepth 3 -maxdepth 3 -path '*/scripts/ci.sh' 2>/dev/null | cut -d/ -f2 | grep -xE '[a-z0-9-]+' | sort | jq -Rnc '[inputs]')
          echo "list=$list" >> "$GITHUB_OUTPUT"

  build:
    needs: runtimes
    if: needs.runtimes.outputs.list != '[]'
    strategy:
      matrix:
        runtime: ${{ fromJSON(needs.runtimes.outputs.list) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: chain-runtimes/${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
      - name: Install build tools
        run: |
          curl -sSfL -o /tmp/binaryen.tgz https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  /tmp/binaryen.tgz" | sha256sum -c -
          sudo tar xzf /tmp/binaryen.tgz -C /opt
          echo /opt/binaryen-version_133/bin >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y clang llvm libsqlite3-dev libssl-dev pkg-config
          rustup toolchain install
          cargo install wasm-pack --version 0.15.0 --locked
          WASM_BINDGEN_VERSION=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - name: Test, build and pack
        env:
          CC_wasm32_unknown_unknown: /usr/bin/clang
          AR_wasm32_unknown_unknown: /usr/bin/llvm-ar
        run: bash scripts/ci.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-${{ matrix.runtime }}
          path: chain-runtimes/${{ matrix.runtime }}/dist/*.tgz
          if-no-files-found: error

  # Separate job so the publish identity never shares a runner with build
  # code, which can rewrite PATH and env for later steps of the same job.
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: runtime-npm-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-*
          path: dist
      - name: Publish versions missing from npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_of() {
            tar -xOzf "$1" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0)); `${p.name}@${p.version}`'
          }
          # Check every tarball before publishing any of them.
          for tgz in dist/runtime-*/*.tgz; do
            runtime=$(basename "$(dirname "$tgz")")
            runtime=${runtime#runtime-}
            pkg=$(package_of "$tgz")
            if [[ "$pkg" != "onekey-$runtime-"* ]]; then
              echo "::error::$tgz is $pkg; a runtime may only publish onekey-$runtime-* packages" >&2
              exit 1
            fi
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              if [[ "${pkg##*@}" != *-alpha.* ]]; then
                echo "::error::$pkg: branches other than main publish alpha versions only" >&2
                exit 1
              fi
            fi
          done
          for tgz in dist/runtime-*/*.tgz; do
            pkg=$(package_of "$tgz")
            if npm view "$pkg" version >/dev/null 2>&1; then
              echo "$pkg already published"
              continue
            fi
            TAG=latest
            if [[ "${pkg##*@}" == *-* ]]; then TAG=next; fi
            npm publish "$tgz" --tag "$TAG"
          done
