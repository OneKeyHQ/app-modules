name: publish-runtime-packages

# Builds and tests the chain runtimes on change. A manual run also publishes
# each package whose version is not on npm yet.
on:
  pull_request:
    paths:
      - 'chain-runtimes/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runtime: zcash
            build: |
              bash scripts/vendor-deps.sh
              python3 -m unittest discover -s scripts -p 'test_*.py'
              cargo test --workspace --locked
              bash scripts/build-wasm.sh --offline
              python3 scripts/package-release.py pack --version "$VERSION" --tag "$TAG" --revision "$GITHUB_SHA"
          - runtime: monero
            build: |
              cargo test --workspace --locked
              bash scripts/build-wasm.sh release
              python3 scripts/package-release.py --version "$VERSION" --tag "$TAG"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: chain-runtimes/${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
      - name: Install build tools
        run: |
          curl -sSfL -o /tmp/binaryen.tgz https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  /tmp/binaryen.tgz" | sha256sum -c -
          sudo tar xzf /tmp/binaryen.tgz -C /opt
          echo /opt/binaryen-version_133/bin >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y clang llvm libsqlite3-dev libssl-dev pkg-config
          rustup toolchain install
          cargo install wasm-pack --version 0.15.0 --locked
          WASM_BINDGEN_VERSION=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - name: Test, build and pack
        env:
          CC_wasm32_unknown_unknown: /usr/bin/clang
          AR_wasm32_unknown_unknown: /usr/bin/llvm-ar
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          TAG=latest
          if [[ "$VERSION" == *-* ]]; then TAG=next; fi
          ${{ matrix.build }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-${{ matrix.runtime }}
          path: chain-runtimes/${{ matrix.runtime }}/dist/*.tgz
          if-no-files-found: error

  # Separate job so the npm token never shares a runner with build code,
  # which can rewrite PATH and env for later steps of the same job.
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-*
          merge-multiple: true
          path: dist
      - name: Publish versions missing from npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for tgz in dist/*.tgz; do
            pkg=$(tar -xOzf "$tgz" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0)); `${p.name}@${p.version}`')
            if npm view "$pkg" version >/dev/null 2>&1; then
              echo "$pkg already published"
              continue
            fi
            TAG=latest
            if [[ "${pkg##*@}" == *-* ]]; then TAG=next; fi
            npm publish "$tgz" --tag "$TAG"
          done
