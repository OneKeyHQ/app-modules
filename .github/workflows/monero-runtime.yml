name: Monero runtime

# Runs when runtime code changes. Edits to these workflow files alone do not
# trigger it (main may not carry the runtime yet); run it manually instead.
on:
  pull_request:
    paths:
      - 'chain-runtimes/monero/**'
  push:
    branches: [main]
    paths:
      - 'chain-runtimes/monero/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: chain-runtimes/monero
    steps:
      - uses: actions/checkout@v6
      - name: Install Binaryen 133 (same wasm-opt as local builds)
        run: |
          BINARYEN=version_133
          case "$(uname -m)" in
            x86_64) ARCH=x86_64 SHA=2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489 ;;
            aarch64) ARCH=aarch64 SHA=89c07ea56faf38d0fbecf36ca8ec0721756716185f265b568e133d427f299bf8 ;;
            *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
          esac
          curl -sSfL -o /tmp/binaryen.tgz "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN}/binaryen-${BINARYEN}-${ARCH}-linux.tar.gz"
          echo "${SHA}  /tmp/binaryen.tgz" | sha256sum -c -
          sudo tar xzf /tmp/binaryen.tgz -C /opt
          echo "/opt/binaryen-${BINARYEN}/bin" >> "$GITHUB_PATH"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libsqlite3-dev libssl-dev pkg-config
          rustup toolchain install
          cargo install wasm-pack --version 0.15.0 --locked
          WASM_BINDGEN_VERSION=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Build runtime
        env:
          CC_wasm32_unknown_unknown: /usr/bin/clang
          AR_wasm32_unknown_unknown: /usr/bin/llvm-ar
        run: bash scripts/build-wasm.sh release
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Pack npm archive
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          TAG=latest
          if [[ "$VERSION" == *-rc.* ]]; then TAG=rc; fi
          if [[ "$VERSION" == *-alpha.* ]]; then TAG=alpha; fi
          python3 scripts/package-release.py --version "$VERSION" --tag "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: monero-npm-${{ github.sha }}
          if-no-files-found: error
          path: chain-runtimes/monero/dist/
