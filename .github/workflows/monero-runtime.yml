name: Monero runtime

on:
  pull_request:
    paths:
      - 'chain-runtimes/monero/**'
      - '.github/workflows/monero-runtime.yml'
      - '.github/workflows/monero-publish.yml'
  push:
    branches: [main]
    paths:
      - 'chain-runtimes/monero/**'
      - '.github/workflows/monero-runtime.yml'
      - '.github/workflows/monero-publish.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: chain-runtimes/monero
    steps:
      - uses: actions/checkout@v6
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm binaryen libsqlite3-dev pkg-config
          rustup toolchain install
          cargo install wasm-pack --version 0.15.0 --locked
          WASM_BINDGEN_VERSION=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Build runtime
        env:
          CC_wasm32_unknown_unknown: /usr/bin/clang
          AR_wasm32_unknown_unknown: /usr/bin/llvm-ar
        run: bash scripts/build-wasm.sh release
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Pack npm archive
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          TAG=latest
          if [[ "$VERSION" == *-rc.* ]]; then TAG=rc; fi
          if [[ "$VERSION" == *-alpha.* ]]; then TAG=alpha; fi
          python3 scripts/package-release.py --version "$VERSION" --tag "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: monero-npm-${{ github.sha }}
          if-no-files-found: error
          path: chain-runtimes/monero/dist/
