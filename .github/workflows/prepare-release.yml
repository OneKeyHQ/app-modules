name: prepare-release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer merge must not replace a pending release preparation.
concurrency:
  group: app-modules-prepare-release
  queue: max

jobs:
  notice-fork-merge:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Explain manual release requirement
        run: |
          echo 'A merged fork PR does not trigger an automatic release. Run prepare-release manually when ready.' >> "$GITHUB_STEP_SUMMARY"

  prepare-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !startsWith(github.event.pull_request.head.ref, 'codex/release-app-modules-v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check for unreleased merges
        id: changes
        run: |
          previous_release=$(git log -1 --format=%H --extended-regexp '--grep=^release: app-modules [0-9]+\.[0-9]+\.[0-9]+')
          test -n "$previous_release" || { echo 'Previous release commit not found'; exit 1; }
          if test "$(git rev-list --count "$previous_release"..HEAD)" -gt 0; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No changes since the previous release'
          fi
      - uses: actions/setup-node@v6
        if: steps.changes.outputs.needed == 'true'
        with:
          node-version: "24.x"
      - name: Bump versions and prepare changelog
        if: steps.changes.outputs.needed == 'true'
        run: |
          corepack enable
          yarn install --immutable
          node --test scripts/*.test.mjs
          yarn version:patch
          YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install
          node scripts/prepare-release.mjs
          node scripts/validate-npm-dist-tag.mjs latest
          git diff --check
      - name: Create repository-scoped release token
        if: steps.changes.outputs.needed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_RELEASE_APP_ID }}
          private-key: ${{ secrets.APP_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: app-modules
          permission-contents: write
          permission-pull-requests: write
      - name: Create or update release PR
        if: steps.changes.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          version=$(node -p "require('./native-views/react-native-native-list/package.json').version")
          branch="codex/release-app-modules-v${version}"
          git config user.name 'onekey-release[bot]'
          git config user.email 'onekey-release[bot]@users.noreply.github.com'
          git add -u CHANGELOG.md yarn.lock native-modules native-views
          git diff --cached --check
          git commit -m "release: app-modules ${version}"
          gh auth setup-git
          remote_sha=$(git ls-remote --heads origin "refs/heads/${branch}" | cut -f1)
          if test -n "$remote_sha"; then
            git push --force-with-lease="refs/heads/${branch}:${remote_sha}" origin "HEAD:refs/heads/${branch}"
          else
            git push origin "HEAD:refs/heads/${branch}"
          fi
          body="Automated version and changelog update for app-modules ${version}. The publish workflow will run only after this PR merges into main."
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --head "$branch" --json number,headRepositoryOwner --jq "[.[] | select(.headRepositoryOwner.login == \"$GITHUB_REPOSITORY_OWNER\")][0].number")
          if test -n "$pr_number"; then
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --title "release: app-modules ${version}" --body "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "release: app-modules ${version}" --body "$body"
          fi
