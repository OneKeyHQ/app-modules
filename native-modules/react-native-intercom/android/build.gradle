apply plugin: 'com.android.library'

apply plugin: 'com.facebook.react'
react {
  libraryName = 'IntercomReactNativeSpec'
  codegenJavaPackageName = 'com.intercom.reactnative'
}

def sdkVersion = { name, fallback -> rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback }
android {
  namespace 'com.intercom.reactnative'
  compileSdkVersion sdkVersion('compileSdkVersion', 36)
  defaultConfig {
    minSdkVersion sdkVersion('minSdkVersion', 24)
    targetSdkVersion sdkVersion('targetSdkVersion', 36)
    buildConfigField 'String', 'INTERCOM_VERSION_NAME', '"10.8.1"'
  }
  buildFeatures { buildConfig true }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
  sourceSets.main.java.srcDirs += ['src/newarch']
}

// The source artifacts' transitive dependencies are resolved in the consumer graph.
def sourceRepository = file('maven')
rootProject.allprojects { candidate ->
  candidate.repositories.maven {
    url = sourceRepository.toURI()
    metadataSources { mavenPom(); ignoreGradleMetadataRedirection() }
    content { includeGroup 'com.onekey.intercom.source' }
  }
}
repositories { google(); mavenCentral() }
dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'com.google.firebase:firebase-messaging:24.1.2'
  implementation 'com.onekey.intercom.source:intercom-base:18.10.0-source.1'
  implementation 'com.onekey.intercom.source:intercom-ui:18.10.0-source.1'
}
