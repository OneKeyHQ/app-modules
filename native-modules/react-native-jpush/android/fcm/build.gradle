apply plugin: 'com.android.library'

android {
  namespace 'com.onekey.jpush.fcm'
  compileSdkVersion rootProject.ext.compileSdkVersion

  defaultConfig {
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    consumerProguardFiles 'consumer-rules.pro'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

def coreProject = rootProject.subprojects.find {
  it.projectDir.canonicalFile == projectDir.parentFile.canonicalFile
}
if (coreProject == null) {
  throw new GradleException('The FCM library requires the autolinked JPush core project.')
}

dependencies {
  implementation project(coreProject.path)
  implementation 'com.google.firebase:firebase-messaging:25.0.1'
}
