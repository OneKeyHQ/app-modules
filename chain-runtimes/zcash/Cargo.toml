[workspace]
resolver = "2"
members = [
  "crates/zcash-runtime",
  "crates/zcash-keys-runtime",
  "crates/zcash-storage-benchmark",
]
exclude = ["vendor/sqlite-wasm-vfs-0.2.0"]

[workspace.package]
version = "0.1.0-alpha.4"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

# ── Zcash dependencies: official stable releases ─────────────────────────
#
# Hard rule: the storage layer comes from unmodified crates.io releases; no
# vendored or forked zcash storage code.
#
# The only change is one Cargo.toml edit to zcash_client_sqlite (see
# scripts/vendor-deps.sh and patches/) that drops rusqlite's "bundled" feature,
# which compiles SQLite's C sources and needs a libc sysroot wasm32 lacks.
# No Zcash Rust source is modified. VFS persistence patches: patches/manifest.json.
[workspace.dependencies]
blake2b_simd = "1"
zcash_client_backend = { version = "0.24.0", default-features = false, features = ["orchard", "transparent-inputs", "lightwalletd-tonic", "sync", "pczt"] }
# serde: create_pczt_from_proposal requires AccountId: Serialize.
zcash_client_sqlite = { version = "0.22.0", default-features = false, features = ["orchard", "transparent-inputs", "serde"] }
zcash_keys = { version = "0.16.1", features = ["orchard", "sapling", "transparent-inputs"] }
zcash_protocol = "0.10"
# default-features = false is required: the default multicore feature makes
# halo2_proofs compile_error on wasm32 without atomics.
zcash_primitives = { version = "0.30", default-features = false }
transparent = { package = "zcash_transparent", version = "0.10" }
zcash_address = "0.13"
zip321 = "0.9.0"
# Same as zcash_client_backend: default features off. They pull the yanked core2 0.3.
pczt = { version = "0.9.3", default-features = false }
orchard = { version = "0.15", default-features = false }

rusqlite = { version = "0.37", default-features = false }
sqlite-wasm-rs = "0.5"
sqlite-wasm-vfs = { version = "0.2", path = "vendor/sqlite-wasm-vfs-0.2.0" }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
tracing = "0.1"
tracing-wasm = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

# Must match zcash_client_sqlite's rand_core major (0.6), or RngCore does not
# unify and init_wallet_db's bounds fail.
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["js"] }
getrandom = "0.4"
thiserror = "2"
schemerz = "0.2"
schemerz-rusqlite = "0.370"
futures-util = { version = "0.3", default-features = false }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }

# lightwalletd uses gRPC-web; browsers cannot speak native gRPC.
# tonic-web-wasm-client must be >= 0.9.1: 0.8.0 drops gRPC trailers.
hex = "0.4"
prost = "0.14"
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tonic-web-wasm-client = "0.9.1"

# Official zcash_client_sqlite release plus the one-line no-bundled patch.
# Run `bash scripts/vendor-deps.sh` first to create vendor/.
[patch.crates-io]
zcash_client_sqlite = { path = "vendor/zcash_client_sqlite-0.22.0" }
tonic-web-wasm-client = { path = "vendor/tonic-web-wasm-client-0.9.1" }

[profile.release]
# Measured: opt-level = 3 is no faster on mainnet scans (msScan 7350-8805 vs
# 8064-8218 per 1000 blocks) but makes the wasm 31% larger (6.8 -> 8.9 MB).
opt-level = "s"
lto = true
codegen-units = 1
# Do not use panic = "abort": on wasm it kills the instance silently and the
# caller sees a Promise that never settles. unwind surfaces as a JS exception
# with a message that the host can catch and report.
panic = "unwind"
