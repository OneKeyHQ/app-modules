[workspace]
resolver = "2"
members = [
  "crates/zcash-runtime",
  "crates/zcash-keys-runtime",
]
exclude = ["vendor/sqlite-wasm-vfs-0.2.0"]

[workspace.package]
version = "0.1.0-alpha.9"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

# Unmodified crates.io releases, except zcash_client_sqlite's Cargo.toml drops rusqlite "bundled"
# (needs a libc sysroot wasm32 lacks). See patches/manifest.json.
[workspace.dependencies]
blake2b_simd = "1"
zcash_client_backend = { version = "0.24.0", default-features = false, features = ["orchard", "transparent-inputs", "lightwalletd-tonic", "sync", "pczt"] }
# serde: create_pczt_from_proposal requires AccountId: Serialize.
zcash_client_sqlite = { version = "0.22.0", default-features = false, features = ["orchard", "transparent-inputs", "serde"] }
zcash_keys = { version = "0.16.1", features = ["orchard", "sapling", "transparent-inputs"] }
zcash_protocol = "0.10"
# default-features = false: multicore makes halo2_proofs compile_error on wasm32 without atomics.
zcash_primitives = { version = "0.30", default-features = false }
transparent = { package = "zcash_transparent", version = "0.10" }
zcash_address = "0.13"
zip321 = "0.9.0"
# Default features pull the yanked core2 0.3.
pczt = { version = "0.9.3", default-features = false }
orchard = { version = "0.15", default-features = false }

rusqlite = { version = "0.37", default-features = false }
sqlite-wasm-rs = "0.5"
sqlite-wasm-vfs = { version = "0.2", path = "vendor/sqlite-wasm-vfs-0.2.0" }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
tracing = "0.1"

# Must match zcash_client_sqlite's rand_core major (0.6) so RngCore unifies.
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["js"] }
getrandom = "0.4"
thiserror = "2"
schemerz = "0.2"
schemerz-rusqlite = "0.370"
futures-util = { version = "0.3", default-features = false }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }

# tonic-web-wasm-client >= 0.9.1: 0.8.0 drops gRPC trailers.
hex = "0.4"
prost = "0.14"
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tonic-web-wasm-client = "0.9.1"

# Run `bash scripts/vendor-deps.sh` first to create vendor/.
[patch.crates-io]
zcash_client_sqlite = { path = "vendor/zcash_client_sqlite-0.22.0" }
tonic-web-wasm-client = { path = "vendor/tonic-web-wasm-client-0.9.1" }

[profile.release]
# opt-level 3 is no faster but ~30% larger.
opt-level = "s"
lto = true
codegen-units = 1
# Not "abort": on wasm it kills the instance silently and the caller's Promise never settles.
panic = "unwind"
